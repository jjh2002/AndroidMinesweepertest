name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Gradle wrapper
        working-directory: AndroidMinesweeper_GitHub
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        working-directory: AndroidMinesweeper_GitHub
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidMinesweeper-debug-apk
          path: AndroidMinesweeper_GitHub/app/build/outputs/apk/debug/*.apk
